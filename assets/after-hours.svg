<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="246" viewBox="0 0 1200 246" role="img" aria-labelledby="title description">
  <title id="title">Serious questions. Playful experiments.</title>
  <desc id="description">A personal laboratory after hours: a tiny pixel companion on floating, wireframe steps. A little curiosity goes a long way.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c26"/>
      <stop offset="1" stop-color="#0b121a"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#57737e" opacity=".22"/>
    </pattern>
    <g id="companion">
      <path d="M-24-20h8v-8h8v8h16v-8h8v8h8v32h-8v8H8v-8H-8v8h-8v-8h-8Z" fill="#77e8cc"/>
      <path d="M-14-8h6v7h-6zm22 0h6v7H8Z" fill="#0b121a"/>
      <path d="M-6 5H6" stroke="#0b121a" stroke-width="3"/>
    </g>
    <g id="toy">
      <ellipse cx="940" cy="191" rx="112" ry="16" fill="#000" opacity=".18"/>
      <g stroke="#77e8cc" stroke-width="1.5" stroke-linejoin="round">
        <path d="m799 153 57-28 57 28-57 28Z" fill="#172f34"/>
        <path d="m799 153 57 28v29l-57-28Z" fill="#102126"/>
        <path d="m856 181 57-28v29l-57 28Z" fill="#12282e"/>
        <path d="m856 124 57-28 57 28-57 28Z" fill="#19383b"/>
        <path d="m856 124 57 28v30l-57-29Z" fill="#11282d"/>
        <path d="m913 152 57-28v30l-57 28Z" fill="#153036"/>
        <path d="m913 95 57-28 57 28-57 28Z" fill="#1c4344"/>
        <path d="m913 95 57 28v30l-57-29Z" fill="#133034"/>
        <path d="m970 123 57-28v30l-57 28Z" fill="#17383b"/>
      </g>
      <use href="#companion" transform="translate(970 76) scale(.88)"/>
      <g stroke="#f1af87" stroke-width="1.7" stroke-linejoin="round">
        <path d="m1082 83 27-14 27 14-27 14Z" fill="#422e2c"/>
        <path d="m1082 83 27 14v29l-27-15Z" fill="#2b2427"/>
        <path d="m1109 97 27-14v29l-27 14Z" fill="#37292a"/>
        <path d="m1082 83 27 15 27-15m-27 15v28" fill="none"/>
      </g>
      <path d="M1038 117q33 44 62 18" fill="none" stroke="#64828d" stroke-width="1.5" stroke-dasharray="3 6"/>
      <path d="m1091 134 11-2-3 11" fill="none" stroke="#64828d" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="m1054 158 2 8 8 2-8 2-2 8-2-8-8-2 8-2Z" fill="#f1af87"/>
      <circle cx="834" cy="98" r="3" fill="#f1af87"/>
      <path d="M858 64h12m-6-6v12" stroke="#66838d" stroke-width="1.5"/>
    </g>
    <style>
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .moving { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="245" rx="20" fill="url(#backdrop)" stroke="#263742"/>
  <path d="M742 24h426v198H742Z" fill="url(#dots)"/>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <circle cx="45" cy="37" r="4" fill="#f1af87"/>
    <text x="59" y="41" font-size="12" font-weight="600" letter-spacing="2.2" fill="#aab9c2">AFTER HOURS / THE CURIOSITY CORNER</text>
    <text x="40" y="96" font-size="34" font-weight="700" letter-spacing=".2" fill="#eef4f7">SERIOUS QUESTIONS.</text>
    <text x="40" y="139" font-size="34" font-weight="700" letter-spacing=".2" fill="#77e8cc">PLAYFUL EXPERIMENTS.</text>
    <text x="41" y="177" font-size="18" fill="#aab9c2">A little curiosity goes a long way.</text>
    <text x="41" y="218" font-size="12" letter-spacing="1.4" fill="#708b98">OBSERVE. TINKER. MAKE SOMETHING UNEXPECTED.</text>
  </g>
  <g class="moving">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="6s" repeatCount="indefinite"/>
    <use href="#toy"/>
  </g>
  <g class="still"><use href="#toy"/></g>
